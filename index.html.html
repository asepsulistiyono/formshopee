<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konfirmasi Pesanan Shopee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ee4d2d 0%, #ff7337 100%);
    padding: 20px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 35px 28px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .icon {
    width: 70px;
    height: 70px;
    background: #fff2ee;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    font-size: 34px;
  }

  h1 {
    text-align: center;
    color: #222;
    font-size: 22px;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-weight: 600;
    color: #333;
    font-size: 14px;
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 13px 16px;
    border: 2px solid #e5e5e5;
    border-radius: 12px;
    font-size: 15px;
    transition: all 0.2s;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: #ee4d2d;
    box-shadow: 0 0 0 4px rgba(238, 77, 45, 0.1);
  }

  .hint {
    font-size: 12px;
    color: #999;
    margin-top: 6px;
  }

  .error {
    color: #e53935;
    font-size: 13px;
    margin-top: 6px;
    display: none;
  }

  button {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(37, 211, 102, 0.35);
  }

  button:active { transform: translateY(0); }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🛒</div>
  <h1>Konfirmasi Pesanan</h1>
  <p class="subtitle">Lengkapi data di bawah ini, lalu kirim ke admin via WhatsApp</p>

  <form id="orderForm">

    <div class="field">
      <label for="orderNumber">Nomor Pesanan Shopee</label>
      <input type="text" id="orderNumber" placeholder="Contoh: 240101ABCD1234" autocomplete="off">
      <div class="hint">Lihat di menu "Pesanan Saya" di aplikasi Shopee</div>
      <div class="error" id="errorOrder">Nomor pesanan wajib diisi!</div>
    </div>

    <div class="field">
      <label for="groomNickname">Nama Panggilan Mempelai Pria</label>
      <input type="text" id="groomNickname" placeholder="Contoh: Budi" autocomplete="off">
      <div class="error" id="errorGroom">Nama panggilan mempelai pria wajib diisi!</div>
    </div>

    <div class="field">
      <label for="brideNickname">Nama Panggilan Mempelai Wanita</label>
      <input type="text" id="brideNickname" placeholder="Contoh: Siti" autocomplete="off">
      <div class="error" id="errorBride">Nama panggilan mempelai wanita wajib diisi!</div>
    </div>

    <button type="submit">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
      </svg>
      Kirim via WhatsApp
    </button>
  </form>
</div>

<script>
  // ============================================
  // GANTI NOMOR INI DENGAN NOMOR WA ADMIN
  // Format: kode negara tanpa tanda +
  // Contoh Indonesia: 6281234567890
  // ============================================
  const ADMIN_WA_NUMBER = "6281234567890";

  const form = document.getElementById('orderForm');
  const orderInput = document.getElementById('orderNumber');
  const groomInput = document.getElementById('groomNickname');
  const brideInput = document.getElementById('brideNickname');

  const errOrder = document.getElementById('errorOrder');
  const errGroom = document.getElementById('errorGroom');
  const errBride = document.getElementById('errorBride');

  // Sembunyikan error saat user mengetik
  const fields = [
    { input: orderInput, err: errOrder },
    { input: groomInput, err: errGroom },
    { input: brideInput, err: errBride }
  ];

  fields.forEach(({ input, err }) => {
    input.addEventListener('input', () => err.style.display = 'none');
  });

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const orderNumber    = orderInput.value.trim();
    const groomNickname  = groomInput.value.trim();
    const brideNickname  = brideInput.value.trim();

    let valid = true;

    if (!orderNumber)   { errOrder.style.display = 'block'; valid = false; }
    if (!groomNickname) { errGroom.style.display = 'block'; valid = false; }
    if (!brideNickname) { errBride.style.display = 'block'; valid = false; }

    if (!valid) {
      // Fokus ke field pertama yang kosong
      if (!orderNumber) orderInput.focus();
      else if (!groomNickname) groomInput.focus();
      else brideInput.focus();
      return;
    }

    // Susun pesan WhatsApp
    const message =
      `Halo Admin 👋%0A%0A` +
      `Saya ingin konfirmasi pesanan Shopee saya.%0A%0A` +
      `📦 *Nomor Pesanan:* ${encodeURIComponent(orderNumber)}%0A` +
      `🤵 *Nama Panggilan Mempelai Pria:* ${encodeURIComponent(groomNickname)}%0A` +
      `👰 *Nama Panggilan Mempelai Wanita:* ${encodeURIComponent(brideNickname)}%0A%0A` +
      `Mohon dibantu prosesnya ya. Terima kasih 🙏`;

    const waURL = `https://wa.me/${ADMIN_WA_NUMBER}?text=${message}`;

    window.open(waURL, '_blank');
  });
</script>

</body>
</html>
